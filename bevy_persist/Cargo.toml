[package]
name = "bevy_persist"
version = "0.1.0"
edition = "2021"
authors = ["Alex Gilbert"]
description = "Automatic persistence for Bevy resources with change detection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alex-Gilbert/bevy_persist"
keywords = ["bevy", "gamedev", "persistence", "save", "settings"]
categories = ["game-development", "config"]

[dependencies]
bevy = { version = "0.15", default-features = false, features = ["bevy_app", "bevy_ecs", "bevy_reflect"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
log = "0.4"
chrono = "0.4"

[dev-dependencies]
bevy = "0.15"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "auto_save"
path = "examples/auto_save.rs"